name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      force_all:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # required for GCP Workload Identity Federation

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go-components: ${{ steps.components.outputs.result }}
      ui-changed: ${{ steps.filter.outputs.ui }}
      is-release: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            order-db: 'mcp-servers/order-db/**'
            payment: 'mcp-servers/payment/**'
            returns-eligibility: 'mcp-servers/returns-eligibility/**'
            shipping: 'mcp-servers/shipping/**'
            inventory: 'mcp-servers/inventory/**'
            fraud-scoring: 'mcp-servers/fraud-scoring/**'
            carrier: 'mcp-servers/carrier/**'
            loyalty-rewards: 'mcp-servers/loyalty-rewards/**'
            pii-guardrail: 'pii-guardrail/**'
            stage-policy-controller: 'stage-policy-controller/**'
            support-triage: 'agents/support-triage/**'
            order-lookup: 'agents/order-lookup/**'
            fraud-check: 'agents/fraud-check/**'
            refund-approval: 'agents/refund-approval/**'
            ui: 'ui/**'
      # A push of a `v*` tag is a release: every component gets rebuilt, tagged
      # with the tag name, and pushed, then the release job publishes it.
      - id: release
        run: echo "result=${{ startsWith(github.ref, 'refs/tags/') }}" >> "$GITHUB_OUTPUT"
      # workflow_dispatch's force_all (or a release) rebuilds every Go component
      # regardless of what changed; otherwise use paths-filter's diff.
      # ALL_GO_COMPONENTS is kept in sync with the filters above as components are added.
      - id: components
        env:
          ALL_GO_COMPONENTS: >-
            ["order-db","payment","returns-eligibility","shipping","inventory","fraud-scoring","carrier","loyalty-rewards","pii-guardrail",
            "stage-policy-controller","support-triage","order-lookup","fraud-check","refund-approval"]
          FORCE_ALL: ${{ github.event.inputs.force_all == 'true' || steps.release.outputs.result == 'true' }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$FORCE_ALL" = "true" ]; then
            echo "result=$ALL_GO_COMPONENTS" >> "$GITHUB_OUTPUT"
          else
            # steps.filter.outputs.changes includes every matched filter name, including
            # "ui" -- exclude it here since UI changes are handled separately by
            # lint-test-ui/build-ui, not the Go component build matrix.
            GO_ONLY=$(echo "$CHANGED" | jq -c '[.[] | select(. != "ui")]')
            echo "result=$GO_ONLY" >> "$GITHUB_OUTPUT"
          fi

  lint-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: 'go.work' }
      - run: gofmt -l . | tee /tmp/fmtdiff && [ ! -s /tmp/fmtdiff ]
      # go.work's `use` directives are workspace modules, not a single module tree, so
      # a bare `./...` from the repo root doesn't resolve -- list each module path
      # explicitly below (kept in sync with go.work as components are added).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: >-
            ./agents/support-triage/... ./agents/order-lookup/... ./agents/fraud-check/...
            ./agents/refund-approval/... ./mcp-servers/order-db/... ./mcp-servers/payment/...
            ./mcp-servers/returns-eligibility/... ./mcp-servers/shipping/... ./mcp-servers/inventory/... ./mcp-servers/fraud-scoring/...
            ./mcp-servers/carrier/... ./mcp-servers/loyalty-rewards/...
            ./pii-guardrail/... ./stage-policy-controller/...
      - run: >-
          go build ./agents/support-triage/... ./agents/order-lookup/... ./agents/fraud-check/...
          ./agents/refund-approval/... ./mcp-servers/order-db/... ./mcp-servers/payment/...
          ./mcp-servers/returns-eligibility/... ./mcp-servers/shipping/... ./mcp-servers/inventory/... ./mcp-servers/fraud-scoring/...
          ./mcp-servers/carrier/... ./mcp-servers/loyalty-rewards/... ./pii-guardrail/... ./stage-policy-controller/...
      - run: >-
          go test ./agents/support-triage/... ./agents/order-lookup/... ./agents/fraud-check/...
          ./agents/refund-approval/... ./mcp-servers/order-db/... ./mcp-servers/payment/...
          ./mcp-servers/returns-eligibility/... ./mcp-servers/shipping/... ./mcp-servers/inventory/... ./mcp-servers/fraud-scoring/...
          ./mcp-servers/carrier/... ./mcp-servers/loyalty-rewards/... ./pii-guardrail/... ./stage-policy-controller/... -v

  lint-test-ui:
    if: needs.changes.outputs.ui-changed == 'true' || github.event.inputs.force_all == 'true' || needs.changes.outputs.is-release == 'true'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ui }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # jsdom's bundled undici needs Node >= 22.19 (vitest fails to boot on Node 20).
        with: { node-version: 24, cache: 'npm', cache-dependency-path: ui/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    needs: [changes, lint-test-go]
    if: needs.changes.outputs.go-components != '[]' || github.event.inputs.force_all == 'true' || needs.changes.outputs.is-release == 'true'
    strategy:
      matrix:
        component: ${{ fromJson(needs.changes.outputs.go-components) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev
      - run: |
          set -euo pipefail
          # pii-guardrail lives at the repo root (it's a policy server, not an MCP
          # server or agent) -- maxdepth 2 from . covers agents/X, mcp-servers/X,
          # and top-level component dirs like pii-guardrail in one search.
          DIR=$(find . -maxdepth 2 -type d -name "${{ matrix.component }}")
          IMG="australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-${{ matrix.component }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          GIT_TAG=""
          if [ "${{ needs.changes.outputs.is-release }}" = "true" ]; then
            GIT_TAG="${{ github.ref_name }}"
          fi
          TAGS=(-t "$IMG:$SHORT_SHA" -t "$IMG:latest")
          if [ -n "$GIT_TAG" ]; then
            TAGS+=(-t "$IMG:$GIT_TAG")
          fi
          docker build "${TAGS[@]}" "$DIR"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push "$IMG:$SHORT_SHA"
            docker push "$IMG:latest"
            if [ -n "$GIT_TAG" ]; then
              docker push "$IMG:$GIT_TAG"
            fi
          fi

  build-ui:
    needs: [changes, lint-test-ui]
    if: needs.changes.outputs.ui-changed == 'true' || github.event.inputs.force_all == 'true' || needs.changes.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev
      - run: |
          set -euo pipefail
          IMG="australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/retail-returns-ui"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          GIT_TAG=""
          if [ "${{ needs.changes.outputs.is-release }}" = "true" ]; then
            GIT_TAG="${{ github.ref_name }}"
          fi
          TAGS=(-t "$IMG:$SHORT_SHA" -t "$IMG:latest")
          if [ -n "$GIT_TAG" ]; then
            TAGS+=(-t "$IMG:$GIT_TAG")
          fi
          docker build "${TAGS[@]}" ui
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push "$IMG:$SHORT_SHA"
            docker push "$IMG:latest"
            if [ -n "$GIT_TAG" ]; then
              docker push "$IMG:$GIT_TAG"
            fi
          fi

  release:
    needs: [changes, build, build-ui]
    if: needs.changes.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: List image locations
        env:
          GO_COMPONENTS: ${{ needs.changes.outputs.go-components }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REGISTRY="australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt"
          {
            echo "## Images"
            echo "$GO_COMPONENTS" | jq -r '.[]' | while read -r component; do
              echo "- \`$REGISTRY/retail-returns-$component:$TAG\`"
            done
            echo "- \`$REGISTRY/retail-returns-ui:$TAG\`"
          } > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
